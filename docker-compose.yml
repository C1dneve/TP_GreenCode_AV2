services:
  postgres:
    image: postgres:17-alpine
    container_name: greencode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greencode
      POSTGRES_PASSWORD: greencode_dev
      POSTGRES_DB: greencode
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - greencode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencode -d greencode"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  greencode_pgdata:
